<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head><body>
<title>Mapa de Combos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root {
  --bg: #eeecf2; --canvas: #e6e3ec; --dot: #cfc8da;
  --surface: #ffffff; --sunk: #f1eef5; --raise: #ffffff;
  --fg: #1d1724; --muted: #6a6175; --line: #dad3e3; --line-strong: #c3b9d0;
  --accent: #6a2bb8; --accent-ink: #ffffff; --accent-soft: #ece2fa;
  --gold: #b07d12; --danger: #c0392b; --ok: #1f8a4c; --on-strong: #ffffff;
  --shadow: 0 1px 2px rgba(20,10,30,.08), 0 8px 24px rgba(20,10,30,.10);
  --f-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #120e17; --canvas: #0d0a11; --dot: #2a2333;
  --surface: #1b1622; --sunk: #231d2c; --raise: #262030;
  --fg: #eee9f4; --muted: #a197ad; --line: #322a3c; --line-strong: #463b53;
  --accent: #b07cf5; --accent-ink: #160d22; --accent-soft: #2e2142;
  --gold: #f2c14e; --danger: #ff6b5e; --ok: #4cd38a; --on-strong: #120e17;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.45);
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #120e17; --canvas: #0d0a11; --dot: #2a2333;
  --surface: #1b1622; --sunk: #231d2c; --raise: #262030;
  --fg: #eee9f4; --muted: #a197ad; --line: #322a3c; --line-strong: #463b53;
  --accent: #b07cf5; --accent-ink: #160d22; --accent-soft: #2e2142;
  --gold: #f2c14e; --danger: #ff6b5e; --ok: #4cd38a; --on-strong: #120e17;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.45);
  color-scheme: dark; }

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font: 14px/1.45 var(--f-body); overflow: hidden; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
kbd { font: 500 11px var(--f-mono); padding: 1px 5px; border: 1px solid var(--line-strong); border-bottom-width: 2px; border-radius: 4px; background: var(--sunk); color: var(--fg); }

/* ---------- App shell ---------- */
#app { position: fixed; inset: 0; display: grid; grid-template-rows: auto 1fr auto; padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left); }
header.bar { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: var(--surface); border-bottom: 1px solid var(--line); min-width: 0; z-index: 20; }
.brand { font: 700 20px/1 var(--f-display); letter-spacing: .03em; text-transform: uppercase; white-space: nowrap; }
.brand span { color: var(--accent); }
.deckpick { display: flex; align-items: center; gap: 6px; min-width: 0; }
.deckpick select { max-width: 200px; }
.tabs { display: flex; align-items: center; gap: 2px; overflow-x: auto; min-width: 0; flex: 1; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { border: 0; background: none; padding: 6px 10px; border-radius: 8px; color: var(--muted); font-weight: 600; white-space: nowrap; }
.tab:hover { background: var(--sunk); color: var(--fg); }
.tab.on { background: var(--accent-soft); color: var(--accent); }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--raise); border-radius: 8px; padding: 6px 10px; font-weight: 500; white-space: nowrap; }
.btn:hover { border-color: var(--line-strong); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.ghost { background: none; border-color: transparent; }
.btn.ghost:hover { background: var(--sunk); }
.btn.sm { padding: 3px 8px; font-size: 12.5px; }
.btn.icon { padding: 6px; width: 32px; height: 32px; justify-content: center; }
.btn.danger { color: var(--danger); }
select, input[type=text], input[type=number], input[type=search], textarea { background: var(--sunk); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; min-width: 0; }
textarea { resize: vertical; width: 100%; }
.spacer { flex: 1; }
.search-trigger { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); min-width: 0; }
.save-ind { font-size: 12px; color: var(--muted); white-space: nowrap; }

main.work { position: relative; display: grid; grid-template-columns: var(--lw, 300px) 1fr var(--rw, 340px); min-height: 0; }
main.work.no-left { --lw: 0px; }
main.work.no-right { --rw: 0px; }
aside { background: var(--surface); min-height: 0; overflow: hidden; display: flex; flex-direction: column; z-index: 10; }
aside.left { border-right: 1px solid var(--line); }
aside.right { border-left: 1px solid var(--line); }
main.work.no-left aside.left, main.work.no-right aside.right { visibility: hidden; }
.ptabs { display: flex; gap: 2px; padding: 8px 8px 0; border-bottom: 1px solid var(--line); }
.ptabs button { flex: 1; border: 0; background: none; padding: 8px 4px 9px; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; }
.ptabs button.on { color: var(--fg); border-bottom-color: var(--accent); }
.pbody { overflow-y: auto; flex: 1; padding: 10px 12px 24px; }
.sec { margin: 12px 0 6px; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.sec h3 { margin: 0; font: 700 15px var(--f-display); text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.sec .n { font: 500 12px var(--f-mono); color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.empty { color: var(--muted); font-size: 13px; padding: 10px 0; }

/* deck rows */
.row { display: grid; grid-template-columns: 22px 1fr auto auto; align-items: center; gap: 8px; padding: 5px 6px; border-radius: 7px; cursor: pointer; user-select: none; }
.row:hover { background: var(--sunk); }
.row.sel { background: var(--accent-soft); }
.row .cost { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font: 600 12px var(--f-mono); background: var(--sunk); border: 1px solid var(--line); }
.row .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .nm .dots { margin-right: 6px; }
.row .q { font: 500 12px var(--f-mono); color: var(--muted); }
.row .st { font-size: 11px; color: var(--muted); }
.row.off .nm { color: var(--muted); }
.row .add { opacity: 0; }
.row:hover .add { opacity: 1; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; vertical-align: 1px; margin-right: 2px; }
.warnchip { font-size: 10.5px; padding: 0 5px; border-radius: 4px; background: color-mix(in srgb, var(--gold) 22%, transparent); color: var(--gold); margin-left: 4px; }

/* curve */
.curve { margin-top: 22px !important; display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; align-items: end; height: 70px; margin: 6px 0 2px; }
.curve .b { background: var(--accent); border-radius: 3px 3px 0 0; min-height: 2px; position: relative; opacity: .85; }
.curve .b span { position: absolute; top: -16px; left: 0; right: 0; text-align: center; font: 500 10.5px var(--f-mono); color: var(--muted); }
.curve-l { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; font: 500 10.5px var(--f-mono); color: var(--muted); text-align: center; }

/* ---------- Canvas ---------- */
#stage { position: relative; overflow: hidden; background-color: var(--canvas); background-image: radial-gradient(var(--dot) 1px, transparent 1.2px); background-size: 24px 24px; touch-action: none; cursor: grab; min-width: 0; outline: none; }
#stage.panning { cursor: grabbing; }
#stage.mode-connect, #stage.mode-record { cursor: crosshair; }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
svg.layer { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: visible; }
#edges { pointer-events: none; }
.edge .hit { stroke: transparent; stroke-width: 18; fill: none; pointer-events: stroke; cursor: pointer; }
.edge .ln { fill: none; stroke-width: 3; stroke-linecap: round; transition: opacity .15s; }
.edge.sel .ln { stroke-width: 5; }
.edge.dim { opacity: .1; }
.edge.dim .hit { pointer-events: none; }
.edge .lbl rect { fill: var(--surface); stroke-width: 1.5; }
.edge .lbl text { font: 600 12px var(--f-body); fill: var(--fg); }
.zlabel { position: absolute; font: 700 26px/1 var(--f-display); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); opacity: .55; white-space: nowrap; pointer-events: none; }
.zlabel small { display: block; font: 500 13px var(--f-mono); letter-spacing: 0; margin-top: 4px; }

.node { position: absolute; width: 150px; user-select: none; -webkit-user-select: none; transition: opacity .18s, filter .18s; touch-action: none; }
.node .cimg { position: relative; width: 150px; height: 210px; border-radius: 9px; overflow: hidden; background: var(--sunk); box-shadow: var(--shadow); outline: 2px solid transparent; outline-offset: 2px; transition: outline-color .12s, transform .12s; }
.node.bf .cimg { width: 210px; height: 150px; }
.node.bf { width: 210px; }
.node:hover .cimg { transform: translateY(-2px); }
.node .cimg img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
.ph { position: absolute; inset: 0; display: none; flex-direction: column; padding: 10px; gap: 6px; color: #fff; background: linear-gradient(160deg, var(--dc, #555), #15111b 85%); }
.node.noimg .ph, .bigcard.noimg .ph { display: flex; }
.node.noimg img, .bigcard.noimg img { display: none; }
.ph .pt { font: 700 17px/1.05 var(--f-display); text-transform: uppercase; letter-spacing: .02em; }
.ph .pty { font-size: 11px; opacity: .85; }
.ph .ptx { font-size: 10.5px; line-height: 1.3; opacity: .95; overflow: hidden; flex: 1; }
.ph .ptx b { font-weight: 600; }
.node .nm { margin-top: 6px; font: 600 12.5px/1.2 var(--f-body); text-align: center; color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.node .qty { position: absolute; top: -8px; right: -8px; min-width: 28px; height: 24px; padding: 0 6px; border-radius: 12px; background: var(--fg); color: var(--bg); font: 600 12px/24px var(--f-mono); text-align: center; box-shadow: var(--shadow); }
.node .zone { position: absolute; top: -8px; left: -6px; padding: 2px 6px; border-radius: 6px; background: var(--gold); color: #1a1205; font: 700 11px var(--f-display); letter-spacing: .05em; text-transform: uppercase; }
.node .port { position: absolute; right: -11px; top: 95px; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); border: 3px solid var(--surface); box-shadow: var(--shadow); opacity: 0; transition: opacity .12s, transform .12s; cursor: crosshair; }
.node.bf .port { top: 64px; }
.node:hover .port, .node.sel .port { opacity: 1; }
.node .port:hover { transform: scale(1.25); }
.node.sel .cimg { outline-color: var(--accent); }
.node.nb .cimg { outline-color: color-mix(in srgb, var(--accent) 45%, transparent); }
.node.dim { opacity: .18; filter: grayscale(.7); }
.node.fdim { opacity: .25; }
.node.hit-search .cimg { outline-color: var(--gold); }
.node.dragging { z-index: 5; }
.node.dragging .cimg { transform: scale(1.03); }
.node .stepb { position: absolute; left: 50%; top: 168px; transform: translateX(-50%); display: none; gap: 3px; }
.node .stepb i { font: 700 13px/26px var(--f-mono); font-style: normal; width: 26px; height: 26px; border-radius: 50%; background: var(--gold); color: #1a1205; text-align: center; box-shadow: var(--shadow); }
.node.has-step .stepb { display: flex; }
.node.step-cur .cimg { outline: 4px solid var(--gold); outline-offset: 3px; box-shadow: 0 0 0 10px color-mix(in srgb, var(--gold) 22%, transparent), var(--shadow); }
.node.step-past { opacity: .75; }
#stage.far .node .nm, #stage.far .edge .lbl { display: none; }
#stage.far .node .qty, #stage.far .node .zone { transform: scale(1.6); transform-origin: top right; }

.marquee { position: absolute; border: 1.5px dashed var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); pointer-events: none; }
.tmp-line { stroke: var(--accent); stroke-width: 3; stroke-dasharray: 6 6; fill: none; }
.cpath { fill: none; stroke: var(--gold); stroke-width: 4; stroke-dasharray: 10 8; animation: march 1s linear infinite; }
@keyframes march { to { stroke-dashoffset: -18; } }
@media (prefers-reduced-motion: reduce) { .cpath { animation: none; } }

/* floating canvas UI */
.float { position: absolute; z-index: 6; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); }
#legend { left: 12px; bottom: 12px; display: flex; flex-wrap: wrap; gap: 4px; padding: 6px; max-width: calc(100% - 260px); }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--raise); border-radius: 999px; padding: 3px 10px 3px 8px; font-size: 12.5px; font-weight: 500; }
.chip .sw { width: 18px; height: 4px; border-radius: 2px; }
.chip.off { opacity: .4; text-decoration: line-through; }
.chip.on { border-color: var(--accent); background: var(--accent-soft); }
#zoomctl { right: 12px; bottom: 168px; display: flex; flex-direction: column; padding: 3px; gap: 2px; }
#zoomctl button { width: 30px; height: 30px; border: 0; background: none; border-radius: 6px; font-weight: 600; }
#zoomctl button:hover { background: var(--sunk); }
#zoomctl .zv { font: 500 10px var(--f-mono); text-align: center; color: var(--muted); padding: 2px 0; }
#minimap { right: 12px; bottom: 12px; width: 208px; height: 144px; padding: 0; overflow: hidden; cursor: pointer; }
#minimap canvas { width: 100%; height: 100%; display: block; }
#modebar { left: 50%; top: 12px; transform: translateX(-50%); padding: 6px 8px 6px 14px; display: none; align-items: center; gap: 10px; font-weight: 500; border-color: var(--accent); }
#modebar.show { display: flex; }
#filters { left: 12px; top: 12px; display: flex; gap: 4px; padding: 5px; flex-wrap: wrap; max-width: calc(100% - 24px); }
#filters .chip { padding: 2px 9px 2px 6px; }
#filters .chip .dot { width: 10px; height: 10px; }

/* playback bar */
#play { left: 50%; bottom: 64px; transform: translateX(-50%); width: min(620px, calc(100% - 24px)); padding: 12px 14px; display: none; border-color: var(--gold); }
#play.show { display: block; }
#play .top { display: flex; align-items: center; gap: 8px; }
#play .title { font: 700 17px var(--f-display); text-transform: uppercase; letter-spacing: .03em; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#play .stepnum { font: 600 13px var(--f-mono); color: var(--gold); }
#play .body { margin-top: 8px; display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: start; }
#play .what { font-weight: 600; }
#play .note { color: var(--muted); font-size: 13px; margin-top: 2px; }
#play .acc { text-align: right; font: 500 12.5px var(--f-mono); white-space: nowrap; }
#play .acc b { font-size: 18px; display: block; color: var(--fg); }
#play .prog { height: 3px; background: var(--sunk); border-radius: 2px; margin-top: 10px; overflow: hidden; }
#play .prog i { display: block; height: 100%; background: var(--gold); transition: width .25s; }

/* hover preview */
#preview { position: fixed; z-index: 40; width: 300px; pointer-events: none; display: none; }
#preview.show { display: block; }
#preview .bigcard { box-shadow: 0 20px 50px rgba(0,0,0,.45); }

/* inspector */
.bigcard { position: relative; width: 100%; aspect-ratio: 744 / 1039; border-radius: 12px; overflow: hidden; background: var(--sunk); }
.bigcard img { width: 100%; height: 100%; object-fit: cover; display: block; }
.bigcard.bf { aspect-ratio: 1039 / 744; }
.bigcard .ph .pt { font-size: 26px; }
.bigcard .ph .ptx { font-size: 13px; }
.insp h2 { margin: 12px 0 2px; font: 700 24px/1.05 var(--f-display); text-transform: uppercase; letter-spacing: .02em; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 6px; background: var(--sunk); font-size: 12px; font-weight: 500; }
.ctext { background: var(--sunk); border-radius: 8px; padding: 10px; font-size: 13px; line-height: 1.5; margin: 8px 0; }
.ctext .kw { font-weight: 600; color: var(--accent); }
.ctext .rem { color: var(--muted); font-style: italic; }
.conn { display: flex; align-items: center; gap: 8px; padding: 6px; border-radius: 7px; cursor: pointer; font-size: 13px; }
.conn:hover { background: var(--sunk); }
.conn .sw { width: 14px; height: 4px; border-radius: 2px; flex: none; }
.conn .t { color: var(--muted); font-size: 12px; white-space: nowrap; }
.conn .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.conn .nt { display: block; color: var(--muted); font-size: 12px; white-space: normal; }
.typepick { display: flex; flex-wrap: wrap; gap: 6px; }
.field { display: grid; gap: 4px; margin: 10px 0; }
.field label { font-size: 12px; font-weight: 600; color: var(--muted); }
.btnrow { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
.hint { font-size: 12.5px; color: var(--muted); background: var(--sunk); border-radius: 8px; padding: 10px; }

/* combos */
.combo { min-width: 0; overflow: hidden; border: 1px solid var(--line); border-radius: 10px; padding: 10px; margin: 8px 0; background: var(--raise); }
.combo.on { border-color: var(--gold); }
.combo .hd { display: flex; align-items: center; gap: 6px; }
.combo .hd input { flex: 1; min-width: 0; font-weight: 600; background: none; border-color: transparent; padding: 3px 4px; }
.combo .hd input:hover, .combo .hd input:focus { border-color: var(--line); background: var(--sunk); }
.combo .sum { font: 500 12px var(--f-mono); color: var(--muted); margin: 4px 4px 0; }
.step > div { min-width: 0; }
.step { display: grid; grid-template-columns: 24px minmax(0,1fr) auto; gap: 8px; padding: 8px 0; border-top: 1px dashed var(--line); }
.step:first-of-type { border-top: 0; }
.step .num { width: 24px; height: 24px; border-radius: 50%; background: var(--gold); color: #1a1205; font: 700 12px/24px var(--f-mono); text-align: center; }
.step .sn { font-weight: 600; font-size: 13px; cursor: pointer; }
.step .sn:hover { text-decoration: underline; }
.step input.note { width: 100%; margin-top: 4px; font-size: 12.5px; }
.step .costs { flex-wrap: wrap; display: flex; gap: 4px; align-items: center; margin-top: 4px; font-size: 12px; color: var(--muted); }
.step .costs input { width: 44px; padding: 2px 4px; font-size: 12px; }
.step .costs select { padding: 2px 4px; font-size: 12px; }
.step .ops { display: flex; flex-direction: column; gap: 2px; }
.step .ops button { border: 0; background: none; color: var(--muted); padding: 0 4px; line-height: 1.2; }
.step .ops button:hover { color: var(--fg); }
.prob { margin-top: 8px; padding: 8px; border-radius: 8px; background: var(--sunk); font-size: 12.5px; }
.prob .bars { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; margin-top: 6px; text-align: center; }
.prob .bars div { font: 500 11px var(--f-mono); }
.prob .bars i { display: block; height: 40px; position: relative; background: var(--surface); border-radius: 3px; margin-bottom: 2px; }
.prob .bars i b { position: absolute; left: 0; right: 0; bottom: 0; background: var(--gold); border-radius: 3px; }

/* library */
.lib-tools { display: grid; gap: 6px; position: sticky; top: -10px; background: var(--surface); padding: 6px 0 8px; z-index: 1; }
.lib-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.lib-card { position: relative; border-radius: 6px; overflow: hidden; aspect-ratio: 744/1039; background: var(--sunk); cursor: pointer; border: 0; padding: 0; }
.lib-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
.lib-card .ln { position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 4px 4px; font-size: 10.5px; font-weight: 600; color: #fff; background: linear-gradient(transparent, rgba(0,0,0,.85)); text-align: left; line-height: 1.15; }
.lib-card.indeck::after { content: attr(data-q); position: absolute; top: 4px; right: 4px; background: var(--accent); color: var(--accent-ink); font: 600 11px/18px var(--f-mono); padding: 0 5px; border-radius: 9px; }

/* modal / palette */
.scrim { position: fixed; inset: 0; background: rgba(10,6,16,.5); z-index: 50; display: none; align-items: flex-start; justify-content: center; padding: 10vh 16px 16px; }
.scrim.show { display: flex; }
.modal { width: min(640px, 100%); max-height: 80vh; overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 18px; }
.modal h2 { margin: 0 0 8px; font: 700 24px var(--f-display); text-transform: uppercase; letter-spacing: .03em; }
.pal { width: min(600px, 100%); padding: 0; overflow: hidden; display: flex; flex-direction: column; max-height: 70vh; }
.pal input { border: 0; border-bottom: 1px solid var(--line); border-radius: 0; background: none; padding: 16px 18px; font-size: 17px; outline: none; }
.pal ul { list-style: none; margin: 0; padding: 6px; overflow-y: auto; }
.pal li { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
.pal li.on { background: var(--accent-soft); }
.pal li .k { font-size: 11px; color: var(--muted); width: 64px; flex: none; text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
.pal li .l { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pal li .h { font-size: 12px; color: var(--muted); }
.pal li img { width: 26px; height: 36px; object-fit: cover; border-radius: 3px; flex: none; }
.pal .foot { border-top: 1px solid var(--line); padding: 8px 14px; font-size: 12px; color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; align-items: center; font-size: 13.5px; }
.keys dt { white-space: nowrap; }
.keys dd { margin: 0; color: var(--muted); }
.edgepop { position: fixed; z-index: 45; padding: 10px; width: 280px; display: none; }
.edgepop.show { display: block; }
.edgepop .typepick .chip { cursor: pointer; }
#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); background: var(--fg); color: var(--bg); padding: 9px 16px; border-radius: 10px; font-weight: 500; z-index: 60; opacity: 0; transition: .2s; pointer-events: none; max-width: calc(100% - 32px); }
#toast.show { opacity: 1; transform: translateX(-50%); }
.report { font-size: 13px; margin: 8px 0; }
.report li { margin: 2px 0; }

/* narrow screens */
.only-narrow { display: none; }
@media (max-width: 1100px) {
  main.work { grid-template-columns: 1fr; }
  aside { position: absolute; top: 0; bottom: 0; width: min(340px, 88vw); box-shadow: var(--shadow); }
  aside.left { left: 0; }
  aside.right { right: 0; }
  main.work.no-left aside.left, main.work.no-right aside.right { display: none; }
  .only-narrow { display: inline-flex; }
  .hide-narrow { display: none !important; }
  #legend { max-width: calc(100% - 24px); bottom: 164px; }
  #zoomctl { bottom: 164px; }
}
@media (max-width: 640px) {
  .brand { display: none; }
  .deckpick select { max-width: 120px; }
  #minimap { width: 150px; height: 104px; }
  #zoomctl, #legend { bottom: 124px; }
}

.th img { width: 100%; height: 100%; object-fit: cover; display: block; }

.th.noimg img { display: none; }

.tile .th { box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .12s; }

.tq { position: absolute; top: 6px; right: 6px; background: rgba(10,6,16,.82); color: #fff; font: 600 12px var(--f-mono); padding: 1px 6px; border-radius: 6px; }
.tq:empty { display: none; }
.tf { position: absolute; top: 6px; left: 6px; background: var(--gold); color: #1a1200; font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 6px; }

.tn { font-size: 12.5px; font-weight: 500; line-height: 1.25; display: flex; gap: 6px; }

.modal:has(.sheet), .modal:has(.hand) { width: min(780px, 100%); }
.sheet { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 18px; }

.plus { font: 700 18px var(--f-display); color: var(--muted); }
.rb h3 { margin: 0 4px 4px 0; font: 700 21px/1.1 var(--f-display); text-transform: uppercase; display: inline; }

.rstats { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--muted); margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); }

.sugs { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 380px), 1fr)); gap: 10px; }

.hand { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; margin: 12px 0; }

.hres { background: var(--sunk); border-radius: 10px; padding: 4px 12px; }

.addrow { display: flex; gap: 8px; flex-wrap: wrap; }

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }

.seg button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.btn.win, .btn.loss { color: var(--on-strong); border-color: transparent; font-weight: 600; padding: 8px 20px; }
.btn.win { background: var(--ok); }
.btn.loss { background: var(--danger); }
.addm { margin-bottom: 8px; }
.tbl { display: grid; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); }
.tr { display: grid; grid-template-columns: minmax(0, 1fr) 70px 56px 140px; gap: 8px; align-items: center; padding: 9px 12px; border: 0; border-top: 1px solid var(--line); background: none; text-align: left; font-size: 13px; }
.tr.thd { border-top: 0; font-size: 11.5px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; background: var(--sunk); }
button.tr:hover { background: var(--sunk); }
.tr.on { background: var(--accent-soft); }
.wr { display: inline-block; width: 56px; height: 6px; background: var(--sunk); border-radius: 3px; overflow: hidden; vertical-align: middle; margin-right: 6px; }

.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }

.hist { display: grid; gap: 3px; }
.hrow { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto auto auto; gap: 8px; align-items: center; padding: 6px 8px; border-radius: 8px; background: var(--surface); font-size: 13px; }

.mugrid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

<script>
'use strict';
/* ============ Datos de cartas ============ */
const IMG_PREFIX = 'https://cmsassets.rgpub.io/sanity/images/dsfx7636/game_data_live/';
const LS_KEY = 'riftbound-mapa-combos.v1';
const NW = 150, NH = 210, BW = 210, BH = 150;
const DOMAINS = {
  Fury: { c: '#e5484d', es: 'Furia' }, Calm: { c: '#30a46c', es: 'Calma' }, Mind: { c: '#3e8ff0', es: 'Mente' },
  Body: { c: '#f08c2e', es: 'Cuerpo' }, Chaos: { c: '#9b5de5', es: 'Caos' }, Order: { c: '#d9b52c', es: 'Orden' }
};
const TYPES_ES = { Legend: 'Leyenda', Unit: 'Unidad', Spell: 'Hechizo', Gear: 'Equipo', Battlefield: 'Battlefield', Rune: 'Runa' };
const ZONES = [
  { id: 'legend', es: 'Leyenda' }, { id: 'champion', es: 'Campeón' }, { id: 'main', es: 'Main deck' },
  { id: 'battlefield', es: 'Battlefields' }, { id: 'rune', es: 'Runas' }, { id: 'side', es: 'Sideboard' }
];
const ZONE_ES = Object.fromEntries(ZONES.map(z => [z.id, z.es]));
const EDGE_TYPES = [
  { id: 'combo', es: 'Combo', c: '#ff4fa3', dash: '' },
  { id: 'sinergia', es: 'Sinergia', c: '#2ec4b6', dash: '' },
  { id: 'habilita', es: 'Habilita', c: '#ffb627', dash: '' },
  { id: 'protege', es: 'Protege', c: '#4c8dff', dash: '2 7' },
  { id: 'respuesta', es: 'Respuesta a', c: '#ff6b4a', dash: '10 7' }
];
const ET = Object.fromEntries(EDGE_TYPES.map(t => [t.id, t]));

const DB = new Map();
function addRows(rows, src) {
  for (const r of rows) {
    const [id, name, type, energy, domains, might, tags, text, img, rarity, power] = r;
    DB.set(id, { id, name, type, power: power ?? null, energy: energy ?? null, domains: domains || [], might: might ?? null, tags: tags || [], text: text || '', img: img ? (/^https?:/.test(img) ? img : IMG_PREFIX + img) : '', rarity: rarity || '', src });
  }
}
addRows(CARD_DATA, 'base');
/* imágenes: paquetes por set publicados junto a la página (img/<set>.json); si no existen, URL oficial */
const IMG = {}, PACK = {}; let packsOk = true, imgT = 0;
function loadPack(s) {
  if (PACK[s]) return PACK[s];
  PACK[s] = fetch('img/' + s + '.json').then(r => { if (!r.ok) throw 0; return r.json(); })
    .then(j => { Object.assign(IMG, j); clearTimeout(imgT); imgT = setTimeout(refreshImages, 60); })
    .catch(() => { packsOk = false; clearTimeout(imgT); imgT = setTimeout(refreshImages, 60); });
  return PACK[s];
}
function imgSrc(id, remote) {
  if (IMG[id]) return IMG[id];
  const s = (id.split('-')[0] || '').toLowerCase();
  if (packsOk && IMG_PACKS.includes(s)) { loadPack(s); return ''; }
  return remote || '';
}
function refreshImages() { if (!S) return; renderNodes(); renderInspector(); if (leftTab === 'lib' && $('#libGrid')) renderLibGrid(); if (typeof VIEW !== 'undefined' && VIEW !== 'map' && !(document.activeElement && document.activeElement.closest && document.activeElement.closest('#view') && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))) renderView(); }
const norm = s => (s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[’`´]/g, "'").replace(/'/g, '').replace(/[^a-z0-9]+/g, ' ').trim();
const NAME_IDX = new Map();
for (const c of DB.values()) { const k = norm(c.name); if (!NAME_IDX.has(k)) NAME_IDX.set(k, c.id); }

function getCard(key) {
  const base0 = DB.get(key) || (CARD_ALIAS[key] && DB.get(CARD_ALIAS[key]));
  const base = base0 && { ...base0, img: imgSrc(base0.id, base0.img) };
  const cu = S && S.custom[key];
  if (base && cu) return { ...base, ...cu, img: cu.img || base.img, id: key };
  if (base) return base;
  if (cu) return { domains: [], tags: [], text: '', img: '', energy: null, might: null, ...cu, id: key, custom: true };
  return { id: key, name: key, type: 'Unit', domains: [], tags: [], text: '', img: '', custom: true };
}
function resolveName(name, zone, code) {
  if (code) { const k = code.toLowerCase(); if (DB.has(k)) return k; }
  const n = norm(name);
  if (NAME_IDX.has(n)) return NAME_IDX.get(n);
  if (name.includes(',')) {
    const [pre, post] = name.split(/,(.+)/).map(s => s.trim());
    const np = norm(post), npre = norm(pre);
    for (const c of DB.values()) if (norm(c.name) === np && (c.type === 'Legend' || c.tags.some(t => norm(t) === npre))) return c.id;
  }
  const key = 'custom:' + n.replace(/ /g, '-');
  if (!S.custom[key] && !DB.has(key)) {
    const type = { legend: 'Legend', champion: 'Unit', battlefield: 'Battlefield', rune: 'Rune' }[zone] || 'Unit';
    S.custom[key] = { name, type, domains: [], text: '', img: '', energy: null, might: null, missing: true };
  }
  return key;
}

/* ============ Migración: cartas que antes no tenían datos ============ */
function migrateState(st) {
  if (!st || !st.custom) return st;
  const remap = {};
  for (const [k, c] of Object.entries(st.custom)) {
    if (!k.startsWith('custom:') || !c || !c.missing) continue;
    const id = NAME_IDX.get(norm(c.name)); if (id) remap[k] = id;
  }
  const ks = Object.keys(remap); if (!ks.length) return st;
  const R = k => remap[k] || k;
  for (const d of st.decks || []) {
    for (const e of d.cards || []) e.key = R(e.key);
    const nn = {}; for (const [k, v] of Object.entries(d.notes || {})) nn[R(k)] = v; d.notes = nn;
    for (const m of d.maps || []) {
      const nodes = {}; for (const [k, v] of Object.entries(m.nodes || {})) nodes[R(k)] = v; m.nodes = nodes;
      for (const e of m.edges || []) { e.from = R(e.from); e.to = R(e.to); }
      for (const c of m.combos || []) for (const s of c.steps || []) s.key = R(s.key);
    }
  }
  for (const k of ks) delete st.custom[k];

}
/* ============ Estado ============ */
let S = null;
const uid = (p = 'x') => p + Math.random().toString(36).slice(2, 9);
function load() {
  try {
    if (typeof localStorage === 'undefined') return null; const t = localStorage.getItem(LS_KEY); if (t) { const s = JSON.parse(t); if (s && s.v === 1 && Array.isArray(s.decks)) return migrateState(s); } } catch (e) { }
  return null;
}
let saveT = 0, DBREF = null, dbReady = false;
const WRITER = uid('w');
function save() {
  clearTimeout(saveT);
  $('#saveInd').textContent = 'Guardando…';
  saveT = setTimeout(async () => {
    try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) { }
    if (DBREF && dbReady) {
      try { await DBREF.set({ state: JSON.parse(JSON.stringify(S)), by: WRITER, at: Date.now() }); $('#saveInd').textContent = 'Guardado en la nube'; }
      catch (e) { $('#saveInd').textContent = e && e.code === 'not_granted' ? 'Solo lectura' : 'Sin conexión: guardado en este navegador'; }
    } else $('#saveInd').textContent = 'Guardado en este navegador';
  }, 600);
}
async function connectDb() {
  try {
    if (!window.claude || !window.claude.use) return;
    const db = await window.claude.use('db'); if (!db) return;
    DBREF = db.doc('app/state');
    const timer = setTimeout(() => { dbReady = true; }, 10000);
    DBREF.onSnapshot(snap => {
      clearTimeout(timer);
      const first = !dbReady; dbReady = true;
      if (!snap.exists) { if (first) $('#saveInd').textContent = 'Listo para guardar en la nube'; return; }
      const d = snap.data();
      if (!d || !d.state || !Array.isArray(d.state.decks) || !d.state.decks.length) return;
      if (d.by === WRITER) return;
      const keepDeck = S && S.deckId, keepView = V && { ...V };
      S = d.state; S.custom = S.custom || {}; migrateState(S);
      if (keepDeck && S.decks.some(x => x.id === keepDeck)) S.deckId = keepDeck;
      try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) { }
      if (S.theme) document.documentElement.dataset.theme = S.theme;
      sel.nodes.clear(); sel.edge = null; if (play) stopPlay();
      renderAll(first);
      if (!first) toast('Mapa actualizado con los últimos cambios');
      $('#saveInd').textContent = 'Guardado en la nube';
    }, () => { dbReady = true; });
  } catch (e) { }
}
const deck = () => S.decks.find(d => d.id === S.deckId) || S.decks[0];
const map = () => { const d = deck(); return d.maps.find(m => m.id === d.mapId) || d.maps[0]; };
const deckEntry = key => deck().cards.find(c => c.key === key);
const deckQty = (key, zone) => deck().cards.filter(c => c.key === key && (!zone || c.zone === zone)).reduce((a, c) => a + c.qty, 0);

/* undo / redo */
const UNDO = [], REDO = [];
function snapshot() { return JSON.stringify({ decks: S.decks, custom: S.custom, deckId: S.deckId }); }
function commit() { UNDO.push(snapshot()); if (UNDO.length > 100) UNDO.shift(); REDO.length = 0; }
function restore(str) { const o = JSON.parse(str); S.decks = o.decks; S.custom = o.custom; S.deckId = o.deckId; sel.nodes.clear(); sel.edge = null; stopPlay(); renderAll(); save(); }
function undo() { if (!UNDO.length) return toast('Nada que deshacer'); REDO.push(snapshot()); restore(UNDO.pop()); toast('Deshecho'); }
function redo() { if (!REDO.length) return toast('Nada que rehacer'); UNDO.push(snapshot()); restore(REDO.pop()); toast('Rehecho'); }

/* ============ Parser de decklist ============ */
const HEADERS = [
  [/^legends?$|^leyendas?$/, 'legend'], [/^champions?$|^campeon(es)?$/, 'champion'],
  [/^main ?deck$|^main$|^deck$|^mazo( principal)?$/, 'main'], [/^battlefields?$|^campos?( de batalla)?$/, 'battlefield'],
  [/^runes?$|^rune deck$|^runas?$/, 'rune'], [/^sideboard$|^side$|^banca$/, 'side']
];
function parseDeck(text) {
  let zone = 'main'; const out = [];
  for (let line of text.split(/\r?\n/)) {
    line = line.trim(); if (!line || line.startsWith('//')) continue;
    const h = norm(line.replace(/:$/, ''));
    const hz = HEADERS.find(([re]) => re.test(h));
    if (hz && (!/^\d/.test(line))) { zone = hz[1]; continue; }
    const m = line.match(/^(\d+)\s*x?\s+(.+?)\s*(?:\[([A-Za-z]{2,4}-[A-Za-z0-9]+)\])?\s*$/i);
    if (!m) continue;
    out.push({ qty: +m[1], name: m[2].trim(), code: m[3] || null, zone });
  }
  return out;
}
function buildDeck(name, text) {
  const rows = parseDeck(text);
  const cards = [], missing = [];
  for (const r of rows) {
    const key = resolveName(r.name, r.zone, r.code);
    if (getCard(key).custom) missing.push(r.name);
    const ex = cards.find(c => c.key === key && c.zone === r.zone);
    if (ex) ex.qty += r.qty; else cards.push({ key, qty: r.qty, zone: r.zone });
  }
  const leg = cards.find(c => c.zone === 'legend');
  const d = { id: uid('d'), name: name || (leg ? getCard(leg.key).name : 'Deck nuevo'), cards, notes: {}, maps: [], mapId: null, source: text };
  const m = newMap('Deck completo', d, true);
  d.maps.push(m); d.mapId = m.id;
  return { d, missing: [...new Set(missing)] };
}

/* ============ Mapas y layout ============ */
function newMap(name, d, fill) {
  const m = { id: uid('m'), name, nodes: {}, edges: [], combos: [], labels: [], view: null };
  if (fill) autoLayout(m, d);
  return m;
}
const isBF = key => getCard(key).type === 'Battlefield';
const nodeSize = key => isBF(key) ? [BW, BH] : [NW, NH];
function lanesFor(d) {
  const seen = new Set(), lanes = { lc: [], unit: [], spell: [], gear: [], bf: [] };
  for (const e of d.cards) {
    if (e.zone === 'rune' || e.zone === 'side' || seen.has(e.key)) continue; seen.add(e.key);
    const c = getCard(e.key);
    if (e.zone === 'legend' || e.zone === 'champion') lanes.lc.push(e.key);
    else if (e.zone === 'battlefield' || c.type === 'Battlefield') lanes.bf.push(e.key);
    else if (c.type === 'Spell') lanes.spell.push(e.key);
    else if (c.type === 'Gear') lanes.gear.push(e.key);
    else lanes.unit.push(e.key);
  }
  const byCost = (a, b) => ((getCard(a).energy ?? 99) - (getCard(b).energy ?? 99)) || getCard(a).name.localeCompare(getCard(b).name);
  lanes.unit.sort(byCost); lanes.spell.sort(byCost); lanes.gear.sort(byCost);
  return lanes;
}
function autoLayout(m, d = deck(), onlyExisting = false) {
  const lanes = lanesFor(d);
  const filt = arr => onlyExisting ? arr.filter(k => m.nodes[k]) : arr;
  const old = m.nodes; m.nodes = {}; m.labels = [];
  const GX = 190, GY = 270, ROWS = 4; let x = 0;
  const place = (title, keys, rows, w = GX, h = GY) => {
    if (!keys.length) return;
    m.labels.push({ x, y: -70, t: title, n: keys.length });
    keys.forEach((k, i) => { m.nodes[k] = { x: x + Math.floor(i / rows) * w, y: (i % rows) * h }; });
    x += Math.max(Math.ceil(keys.length / rows) * w, title.length * 16 + 20) + 90;
  };
  place('Leyenda y campeón', filt(lanes.lc), ROWS);
  place('Unidades', filt(lanes.unit), ROWS);
  place('Hechizos', filt(lanes.spell), ROWS);
  place('Equipo', filt(lanes.gear), ROWS);
  place('Battlefields', filt(lanes.bf), ROWS, 250, 200);
  // cartas en el mapa que no pertenecen a ningún carril (ej. sideboard añadido)
  const rest = Object.keys(old).filter(k => !m.nodes[k]);
  if (rest.length) place('Otras / sideboard', rest, ROWS);
}

/* ============ Selección / modos ============ */
const sel = { nodes: new Set(), edge: null };
let mode = null; // {type:'connect', from} | {type:'record', comboId}
let focusMode = true;
const hiddenTypes = new Set();
const domFilter = new Set();
let play = null; // {comboId, i, auto, timer}
let activeCombo = null;

/* ============ Vista (pan / zoom) ============ */
const V = { x: 0, y: 0, k: 1 };
const stage = () => $('#stage');
function applyView() {
  $('#world').style.transform = `translate(${V.x}px,${V.y}px) scale(${V.k})`;
  $('#zVal').textContent = Math.round(V.k * 100) + '%';
  stage().classList.toggle('far', V.k < 0.5);
  const m = map(); if (m) m.view = { x: V.x, y: V.y, k: V.k };
  drawMinimap();
  viewSaveDebounced();
}
let vsT = 0; function viewSaveDebounced() { clearTimeout(vsT); vsT = setTimeout(() => { try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) { } }, 800); }
const clampK = k => Math.min(2.5, Math.max(0.12, k));
function zoomAt(px, py, k) { k = clampK(k); V.x = px - (px - V.x) * k / V.k; V.y = py - (py - V.y) * k / V.k; V.k = k; applyView(); }
function zoomBy(f) { const r = stage().getBoundingClientRect(); animateTo(...centerTarget(r.width / 2, r.height / 2, clampK(V.k * f))); }
function centerTarget(px, py, k) { return [px - (px - V.x) * k / V.k, py - (py - V.y) * k / V.k, k]; }
let anim = 0;
function animateTo(x, y, k, ms = 380) {
  cancelAnimationFrame(anim);
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) ms = 0;
  const s = { ...V }, t0 = performance.now();
  const step = t => {
    const p = ms ? Math.min(1, (t - t0) / ms) : 1, e = 1 - Math.pow(1 - p, 3);

    if (p < 1) anim = requestAnimationFrame(step);
  };
  anim = requestAnimationFrame(step);
}
function bounds(keys) {
  const m = map(); keys = keys || Object.keys(m.nodes);
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const k of keys) { const n = m.nodes[k]; if (!n) continue; const [w, h] = nodeSize(k); x0 = Math.min(x0, n.x); y0 = Math.min(y0, n.y); x1 = Math.max(x1, n.x + w); y1 = Math.max(y1, n.y + h + 24); }
  for (const l of (keys === undefined || keys.length === Object.keys(m.nodes).length ? m.labels : [])) { x0 = Math.min(x0, l.x); y0 = Math.min(y0, l.y); }
  if (x0 === Infinity) return null;
  return { x0, y0, x1, y1 };
}
function fit(keys, maxK = 1.1, ms) {
  const b = bounds(keys); const r = stage().getBoundingClientRect();
  if (!b) { animateTo(r.width / 2, r.height / 2, 1, ms); return; }
  const pad = 80, w = b.x1 - b.x0, h = b.y1 - b.y0;
  const k = clampK(Math.min((r.width - pad * 2) / w, (r.height - pad * 2 - 40) / h, maxK));
  animateTo(r.width / 2 - (b.x0 + w / 2) * k, r.height / 2 - (b.y0 + h / 2) * k - 10, k, ms);
}
function centerOn(key, k) {
  const n = map().nodes[key]; if (!n) return;

  k = k || Math.max(V.k, 0.8);
  animateTo(r.width / 2 - (n.x + w / 2) * k, r.height / 2 - (n.y + h / 2) * k, k);
}
function inView(key) {
  const n = map().nodes[key]; if (!n) return false; const r = stage().getBoundingClientRect(); const [w, h] = nodeSize(key);
  const sx = n.x * V.k + V.x, sy = n.y * V.k + V.y;
  return sx > 20 && sy > 20 && sx + w * V.k < r.width - 20 && sy + h * V.k < r.height - 20;
}
const toWorld = (cx, cy) => { const r = stage().getBoundingClientRect(); return [(cx - r.left - V.x) / V.k, (cy - r.top - V.y) / V.k]; };

/* ============ Render: nodos ============ */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const dcol = c => (c.domains && c.domains[0] && DOMAINS[c.domains[0]]) ? DOMAINS[c.domains[0]].c : '#6b6178';
function fmtText(t) {
  return esc(t).replace(/\[([^\]]+)\]/g, '<span class="kw">$1</span>').replace(/\(([^)]*)\)/g, '<span class="rem">($1)</span>');
}
function imgTag(c, extraCls = '') {
  if (!c.img) return '';
  return `<img src="${esc(c.img)}" alt="" loading="lazy" decoding="async" class="${extraCls}" onerror="this.closest('.node,.bigcard,.lib-card')?.classList.add('noimg')">`;
}
function phTag(c) {
  const dom = (c.domains || []).map(d => DOMAINS[d]?.es || d).join(' · ');

  const playable = card.type === 'Spell' || card.type === 'Unit' || card.type === 'Gear';
  c.steps.push({ key, note: '', energy: playable ? (card.energy ?? 0) : 0, power: playable ? (card.power ?? 0) : 0, pdom: (card.domains || []).length === 1 ? card.domains[0] : '' });
  save(); renderLeft(); applyClasses(); toast(`Paso ${c.steps.length}: ${card.name}`);
}
function comboTotals(c, upto = Infinity) {
  let en = 0; const pw = {};
  c.steps.slice(0, upto).forEach(s => { en += +s.energy || 0; if (+s.power) pw[s.pdom || 'Cualquiera'] = (pw[s.pdom || 'Cualquiera'] || 0) + (+s.power); });
  const ptot = Object.values(pw).reduce((a, b) => a + b, 0);

}
const fmtPw = pw => Object.entries(pw).map(([d, n]) => `${n} ${DOMAINS[d]?.es || d}`).join(' · ');
// probabilidad de tener todas las piezas (al menos 1 copia de cada una) entre las n primeras cartas
function lnC(n, k) { if (k < 0 || k > n) return -Infinity; let s = 0; for (let i = 1; i <= k; i++) s += Math.log((n - k + i) / i); return s; }
function probAll(pieces, N, n) {
  const m = pieces.length; let p = 0;
  for (let mask = 0; mask < (1 << m); mask++) {
    let sum = 0, bits = 0; for (let i = 0; i < m; i++) if (mask & (1 << i)) { sum += pieces[i]; bits++; }
    const v = Math.exp(lnC(N - sum, n) - lnC(N, n)); p += (bits % 2 ? -1 : 1) * (isFinite(v) ? v : 0);
  }
  return Math.max(0, Math.min(1, p));
}
function comboPieces(c) {
  const keys = [...new Set(c.steps.map(s => s.key))];
  return keys.map(k => ({ key: k, q: deckQty(k, 'main') })).filter(p => p.q > 0);
}
const mainSize = () => deck().cards.filter(c => c.zone === 'main').reduce((a, c) => a + c.qty, 0);

/* reproducción */
function startPlay(cid, i = 0) {
  const c = comboById(cid); if (!c || !c.steps.length) return toast('Esta línea todavía no tiene pasos');

  sel.nodes.clear(); sel.edge = null;

}
function stepPlay(delta) {
  const c = comboById(play.comboId); if (!c) return stopPlay();
  play.i = Math.max(0, Math.min(c.steps.length - 1, play.i + delta));
  const s = c.steps[play.i], card = getCard(s.key), t = comboTotals(c, play.i + 1);
  $('#plNum').textContent = `${play.i + 1}/${c.steps.length}`;
  $('#plTitle').textContent = c.name;
  $('#plWhat').textContent = card.name;
  $('#plNote').textContent = s.note || card.text.replace(/\([^)]*\)/g, '').slice(0, 160);
  $('#plAcc').innerHTML = `<b>${t.en} energía</b>${t.ptot ? fmtPw(t.pw) : 'sin runas de poder'}<br><span class="muted">≈ ${t.en + t.ptot} runas en total</span>`;
  $('#plProg').style.width = ((play.i + 1) / c.steps.length * 100) + '%';
  $('#plAuto').textContent = play.auto ? '❚❚' : '▶';

function toggleAuto() {

  if (play.auto) {
    const c = comboById(play.comboId); if (play.i >= c.steps.length - 1) play.i = -1, stepPlay(1);
    play.timer = setInterval(() => { const c = comboById(play.comboId); if (!c || play.i >= c.steps.length - 1) { play.auto = false; clearInterval(play.timer); $('#plAuto').textContent = '▶'; return; } stepPlay(1); }, 2200);

}

/* navegación espacial con flechas */
function navDir(dx, dy) {
  const m = map(); const keys = Object.keys(m.nodes); if (!keys.length) return;
  let cur = sel.nodes.size === 1 ? [...sel.nodes][0] : null;
  if (!cur) { // la más cercana al centro de la pantalla
    const r = stage().getBoundingClientRect(); const [cx, cy] = [(r.width / 2 - V.x) / V.k, (r.height / 2 - V.y) / V.k];
    cur = keys.reduce((b, k) => { const [x, y] = center(k); const d = Math.hypot(x - cx, y - cy); return d < b[1] ? [k, d] : b; }, [null, Infinity])[0];
    return selectKey(cur);
  }
  const [x0, y0] = center(cur); let best = null, bs = Infinity;
  for (const k of keys) {
    if (k === cur) continue; const [x, y] = center(k); const vx = x - x0, vy = y - y0;
    const along = vx * dx + vy * dy; if (along <= 10) continue;
    const across = Math.abs(vx * dy - vy * dx); const s = along + across * 2.2;
    if (s < bs) { bs = s; best = k; }
  }
  if (best) selectKey(best);
}
// Tab: recorrer conexiones de la carta seleccionada
function cycleNeighbor(back) {
  const k = sel.nodes.size === 1 ? [...sel.nodes][0] : null; if (!k) return navDir(1, 0);
  const nbs = []; for (const e of map().edges) { if (hiddenTypes.has(e.type)) continue; if (e.from === k) nbs.push(e.to); else if (e.to === k) nbs.push(e.from); }
  const u = [...new Set(nbs)]; if (!u.length) return toast('Esta carta no tiene conexiones todavía');
  cycleNeighbor.i = ((cycleNeighbor.last === k ? cycleNeighbor.i : -1) + (back ? -1 : 1) + u.length) % u.length;
  const next = u[cycleNeighbor.i]; cycleNeighbor.last = next; selectKey(next); cycleNeighbor.last = next;
}

function addToDeck(key, zone) { commit(); const d = deck(); const ex = d.cards.find(c => c.key === key && c.zone === zone); if (ex) ex.qty++; else d.cards.push({ key, qty: 1, zone }); save(); renderAll(); toast(`Añadida al ${zone === 'side' ? 'sideboard' : 'main deck'}`); }

/* editar datos de una carta */
function editCard(key) {
  const c = getCard(key);
  openModal(`<h2>Editar carta</h2><p class="small muted">Los cambios se guardan en este navegador y se incluyen al exportar.</p>
    <div class="field"><label>Nombre</label><input type="text" id="ecName" value="${esc(c.name)}"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">
      <div class="field"><label>Tipo</label><select id="ecType">${Object.entries(TYPES_ES).map(([k, v]) => `<option value="${k}"${c.type === k ? ' selected' : ''}>${v}</option>`).join('')}</select></div>
      <div class="field"><label>Energía</label><input type="number" id="ecEn" value="${c.energy ?? ''}"></div>
      <div class="field"><label>Might</label><input type="number" id="ecMi" value="${c.might ?? ''}"></div></div>
    <div class="field"><label>Dominios</label><div class="typepick">${Object.entries(DOMAINS).map(([k, v]) => `<label class="chip"><input type="checkbox" value="${k}" ${(c.domains || []).includes(k) ? 'checked' : ''}> <span class="dot" style="background:${v.c}"></span>${v.es}</label>`).join('')}</div></div>
    <div class="field"><label>Texto (usa [Palabra clave] para resaltar)</label><textarea id="ecTx" rows="4">${esc(c.text)}</textarea></div>
    <div class="field"><label>Imagen</label><div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap"><label class="btn sm" for="ecFile">Subir imagen…</label><input type="file" id="ecFile" accept="image/*" hidden><span class="small muted" id="ecImgSt">${c.img && !/^https?:/.test(c.img) ? 'Imagen propia cargada' : 'También puedes soltar una imagen encima de la carta en el mapa'}</span></div><input type="text" id="ecImg" value="${esc((S.custom[key] && S.custom[key].img && !S.custom[key].img.startsWith('data:')) ? S.custom[key].img : '')}" placeholder="o pega una URL" style="margin-top:6px"></div>
    <div class="btnrow"><button class="btn primary" id="ecOk">Guardar</button><button class="btn" id="ecCancel">Cancelar</button>${S.custom[key] && DB.has(key) ? '<button class="btn danger" id="ecReset">Volver a los datos oficiales</button>' : ''}</div>`);
  $('#ecCancel').onclick = closeModal;
  $('#ecFile').onchange = async ev => { const f = ev.target.files[0]; if (!f) return; $('#ecImgSt').textContent = 'Subiendo…'; const u = await uploadImage(f); if (u) { $('#ecImg').value = u; $('#ecImgSt').textContent = 'Imagen lista: pulsa Guardar'; } else $('#ecImgSt').textContent = 'No pude subir la imagen'; };
  $('#ecReset') && ($('#ecReset').onclick = () => { commit(); delete S.custom[key]; save(); closeModal(); renderAll(); });
  $('#ecOk').onclick = () => {
    commit();
    const num = v => v === '' ? null : +v;
    S.custom[key] = { ...(S.custom[key] || {}), name: $('#ecName').value.trim() || c.name, type: $('#ecType').value, energy: num($('#ecEn').value), might: num($('#ecMi').value), domains: [...document.querySelectorAll('#modal .typepick input:checked')].map(i => i.value), text: $('#ecTx').value, img: $('#ecImg').value.trim() || (S.custom[key] && S.custom[key].img) || '', missing: false };
    save(); closeModal(); renderAll(); toast('Carta actualizada');
  };
}
/* imágenes propias: al almacén del artifact o, si no hay, reducidas a data URI */
async function uploadImage(file) {
  try {
    const assets = window.claude && window.claude.use ? await window.claude.use('assets') : null;
    if (assets) { const r = await assets.upload(file); if (r && r.url) return r.url; }
  } catch (e) { }
  try {
    const bmp = await createImageBitmap(file); const w = 360, h = Math.round(bmp.height * w / bmp.width);
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h; cv.getContext('2d').drawImage(bmp, 0, 0, w, h);
    return cv.toDataURL('image/jpeg', 0.8);
  } catch (e) { return null; }
}
async function setCardImage(key, file) {
  toast('Subiendo imagen…'); const u = await uploadImage(file); if (!u) return toast('No pude usar esa imagen');
  commit(); S.custom[key] = { ...(S.custom[key] || {}), img: u }; save(); renderAll(); toast('Imagen actualizada');
}
/* búsqueda en Riftcodex (desde el navegador del usuario) */
async function lookupRiftcodex(key) {
  const c = getCard(key);
  if (window.claude) { openModal(`<h2>Buscar “${esc(c.name)}”</h2><p>Desde esta página no puedo consultar webs externas. Abre la búsqueda en otra pestaña, copia los datos y pégalos en “Editar datos”. O pídeme en el chat que la complete yo.</p><p><a href="https://riftcodex.com" target="_blank" rel="noopener">Abrir Riftcodex</a> · <a href="https://piltoverarchive.com/cards" target="_blank" rel="noopener">Abrir Piltover Archive</a></p><div class="btnrow"><button class="btn primary" id="lkEdit">Editar datos</button><button class="btn" onclick="closeModal()">Cerrar</button></div>`); $('#lkEdit').onclick = () => { closeModal(); editCard(key); }; return; }
  toast('Buscando en Riftcodex…');
  try {
    const r = await fetch('https://api.riftcodex.com/cards/name?fuzzy=' + encodeURIComponent(c.name) + '&size=20');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json(); const items = j.items || j.data || j.results || (Array.isArray(j) ? j : []);
    const it = items.find(x => norm(x.name) === norm(c.name)) || items.find(x => norm(x.name).startsWith(norm(c.name)));
    if (!it) { toast('No apareció en Riftcodex. Puedes completar los datos a mano.'); return editCard(key); }
    const a = it.attributes || {}, cl = it.classification || {}, tx = it.text || {}, md = it.media || {};
    commit();
    S.custom[key] = { name: it.name, type: cl.type || c.type, energy: a.energy ?? null, might: a.might ?? null, domains: (cl.domain || []).filter(d => DOMAINS[d]), text: (tx.plain || tx.rich || '').replace(/:rb_might:/g, 'might').replace(/:rb_energy_(\d+):/g, '$1 energía').replace(/:rb_rune_(\w+):/g, '1 runa $1').replace(/<[^>]+>/g, ''), img: md.image_url || '', tags: it.tags || [], rarity: cl.rarity || '', missing: false };
    save(); renderAll(); toast('Datos cargados desde Riftcodex');
  } catch (e) {
    toast('No pude conectar con Riftcodex desde aquí. Completa los datos a mano.'); editCard(key);
  }
}

/* ============ Teclado ============ */
function onKey(ev) {
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName) || document.activeElement?.isContentEditable;
  const mod = ev.metaKey || ev.ctrlKey;
  if (mod && ev.key.toLowerCase() === 'k') { ev.preventDefault(); $('#palScrim').classList.contains('show') ? closePalette() : openPalette(); return; }
  if ($('#palScrim').classList.contains('show')) {
    if (ev.key === 'Escape') { ev.preventDefault(); closePalette(); }
    else if (ev.key === 'ArrowDown') { ev.preventDefault(); palIdx = Math.min(palItems.length - 1, palIdx + 1); markPal(); }
    else if (ev.key === 'ArrowUp') { ev.preventDefault(); palIdx = Math.max(0, palIdx - 1); markPal(); }
    else if (ev.key === 'Enter') { ev.preventDefault(); runPal(palIdx); }
    return;
  }
  if ($('#modalScrim').classList.contains('show')) { if (ev.key === 'Escape') closeModal(); return; }
  if ($('#edgepop').classList.contains('show') && !typing) {
    const e = map().edges.find(x => x.id === $('#edgepop').dataset.id);
    if (/^[1-5]$/.test(ev.key) && e) { setEdgeType(e, EDGE_TYPES[+ev.key - 1].id); return; }
    if (ev.key === 'Enter' || ev.key === 'Escape') { hideEdgePop(); return; }
  }
  if (typing) { if (ev.key === 'Escape') document.activeElement.blur(); return; }
  if (!mod && !ev.altKey && /^[1-4]$/.test(ev.key) && !play) { setView(['deck', 'combos', 'map', 'games'][+ev.key - 1]); return; }
  if (!mod && (ev.key === 'h' || ev.key === 'H') && !play && VIEW !== 'map') { openHand(); return; }
  if (VIEW !== 'map' && ev.key === '?') { showHelp(); return; }
  if (VIEW !== 'map' && !(mod && /^[zy]$/i.test(ev.key))) return;
  if (mod && ev.key.toLowerCase() === 'z') { ev.preventDefault(); ev.shiftKey ? redo() : undo(); return; }
  if (mod && ev.key.toLowerCase() === 'y') { ev.preventDefault(); redo(); return; }
  if (mod && ev.key.toLowerCase() === 'a') { ev.preventDefault(); Object.keys(map().nodes).forEach(k => sel.nodes.add(k)); onSelChange(); return; }
  if (mod) return;
  const k = ev.key;
  if (play) {
    if (k === 'ArrowRight' || k === ' ') { ev.preventDefault(); stepPlay(1); return; }
    if (k === 'ArrowLeft') { ev.preventDefault(); stepPlay(-1); return; }
    if (k === 'p' || k === 'P') { toggleAuto(); return; }
    if (k === 'Escape') { stopPlay(); return; }
  }
  if (k === 'Escape') { if (mode) setMode(null); else if (sel.nodes.size || sel.edge || libPreview) { sel.nodes.clear(); sel.edge = null; libPreview = null; onSelChange(); renderEdges(); } return; }
  if (k === '/') { ev.preventDefault(); openPalette('@'); return; }
  if (k === '?') { showHelp(); return; }
  if (k === 'f' || k === 'F') { sel.nodes.size > 1 ? fit([...sel.nodes]) : fit(); return; }
  if (k === '0') { const r = stage().getBoundingClientRect(); animateTo(...centerTarget(r.width / 2, r.height / 2, 1)); return; }
  if (k === '+' || k === '=') { zoomBy(1.25); return; }
  if (k === '-' || k === '_') { zoomBy(0.8); return; }
  if (k === '[') { toggleLeft(); return; }
  if (k === ']') { toggleRight(); return; }
  if (k === 'e' || k === 'E') { toggleFocus(); return; }
  if (k === 'l' || k === 'L') { relayout(); return; }
  if (k === 'i' || k === 'I') { importDeckUI(); return; }
  if (k === 'n' || k === 'N') { const c = newCombo(); setMode({ type: 'record', comboId: c.id }); return; }
  if ((k === 'r' || k === 'R') && activeCombo) { mode?.type === 'record' ? setMode(null) : setMode({ type: 'record', comboId: activeCombo }); return; }
  if ((k === 'p' || k === 'P') && activeCombo) { startPlay(activeCombo); return; }
  if ((k === 'c' || k === 'C') && sel.nodes.size === 1) { setMode({ type: 'connect', from: [...sel.nodes][0] }); return; }
  if (k === 'Enter' && sel.nodes.size === 1) { centerOn([...sel.nodes][0], Math.max(V.k, 1.15)); return; }
  if (/^[1-5]$/.test(k) && sel.edge) { const e = map().edges.find(x => x.id === sel.edge); if (e) setEdgeType(e, EDGE_TYPES[+k - 1].id); return; }
  if (k === 'Tab') { ev.preventDefault(); cycleNeighbor(ev.shiftKey); return; }
  if (k === 'Delete' || k === 'Backspace') { if (sel.edge) deleteEdge(sel.edge); else if (sel.nodes.size) removeFromMap([...sel.nodes]); return; }
  const dirs = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
  if (dirs[k]) { ev.preventDefault(); navDir(...dirs[k]); }
}

function autoRole(key, zone) {
  const c = getCard(key), t = (c.text || '').toLowerCase();

  if (c.type === 'Battlefield' || zone === 'battlefield') return 'campo';
  if (c.type === 'Unit') {
    if (/from your trash/.test(t)) return 'robo';
    if (/\bmove\b|when i move/.test(t)) return 'habilita';
    if (/\bdraw \d/.test(t)) return 'robo';

  if (/counter a spell|\bkill\b|deal \d+ damage|damage equal|return a unit|return a friendly unit and an enemy|\bstun\b|recycle that card|reveal their hand|prevent/.test(t)) return 'interaccion';
  if (/\+\d+ might|swap the might/.test(t)) return 'truco';
  if (/\bmove\b/.test(t)) return 'habilita';

}

}

function recipeStats(d, r) {
  const N = mainSize();
  const pcs = [...new Set(r.pieces)].map(k => ({ k, q: deckQty(k, 'main') }));
  const inDeck = pcs.filter(p => p.q > 0);
  const missing = pcs.filter(p => p.q === 0 && !d.cards.some(e => e.key === p.k));
  let en = 0, pw = 0; for (const p of pcs) { const c = getCard(p.k); if (c.type !== 'Legend' && c.type !== 'Battlefield') { en += c.energy || 0; pw += c.power || 0; } }
  const P = t => inDeck.length ? probAll(inDeck.map(p => p.q), N, Math.min(N, 4 + t)) : 1;

}
function suggestions(d) {

  for (const m of d.maps) for (const e of m.edges) if (e.type === 'combo' || e.type === 'habilita') add(e.from, e.to, e.note || `${ET[e.type].es} (de tu mapa)`, 'mapa');
  const keys = [...new Set(d.cards.filter(e => e.zone !== 'rune').map(e => e.key))];
  for (const a of keys) for (const b of keys) {
    if (a === b) continue; const A = getCard(a), B = getCard(b), ta = (A.text || '').toLowerCase(), tb = (B.text || '').toLowerCase();
    if (/move a friendly unit|move me|move a unit/.test(ta) && /when i move/.test(tb)) add(a, b, `${A.name} mueve a ${B.name} y activa su efecto al moverse.`, 'auto');
    if (/play a spell from your trash/.test(ta) && B.type === 'Spell' && (B.energy ?? 9) <= 3) add(a, b, `${A.name} rejuega ${B.name} desde el trash sin pagar su energía.`, 'auto');
    if (/gain \d+ xp/.test(tb) && A.type === 'Legend' && /spend \d+ xp/.test(ta)) add(b, a, `${B.name} gana XP que la leyenda gasta.`, 'auto');
    if (/is alone|defending alone/.test(tb) && /move an enemy unit|move an enemy|return a unit at a battlefield/.test(ta)) add(a, b, `${A.name} deja sola a una unidad enemiga para ${B.name}.`, 'auto');
  }
  return out.slice(0, 12);
}

/* ---------- Robar mano ---------- */
let HAND = null;
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function openHand() {
  const d = deck(); const pile = [];
  for (const e of d.cards) if (e.zone === 'main') for (let i = 0; i < e.qty; i++) pile.push(e.key);
  shuffle(pile); HAND = { pile, hand: pile.splice(0, 4), marked: new Set(), turn: 0, mulled: false };
  drawHand();
}

  const have = new Set([...h.hand, ...always]);
  const ok = d.recipes.filter(r => r.pieces.some(k => !always.has(k)) && r.pieces.every(k => have.has(k)));
  const near = d.recipes.filter(r => !ok.includes(r)).map(r => ({ r, miss: r.pieces.filter(k => !have.has(k)) })).filter(x => x.miss.length === 1);
  const champ = d.cards.find(e => e.zone === 'champion');
  openModal(`<h2>Robar mano</h2>
    <p class="small muted">${h.turn ? `Turno ${h.turn} · ` : 'Mano inicial · '}${h.hand.length} cartas en mano · ${h.pile.length} en el mazo${champ ? ` · Campeón listo: ${esc(getCard(champ.key).name)}` : ''}</p>
    <div class="hand">${h.hand.map((k, i) => `<button class="hcard${h.marked.has(i) ? ' mk' : ''}" data-i="${i}" ${h.mulled || h.turn ? 'disabled' : ''}>${thumb(k)}</button>`).join('')}</div>
    ${!h.mulled && !h.turn ? '<p class="small muted">Mulligan: toca hasta 2 cartas para cambiarlas.</p>' : ''}
    <div class="hres">${ok.length ? `<p><b style="color:var(--ok)">✔ Combo listo:</b> ${ok.map(r => esc(r.name)).join(', ')}</p>` : '<p class="muted">Ningún combo completo todavía.</p>'}
    ${near.length ? `<p class="small">A una carta de: ${near.map(x => `${esc(x.r.name)} <span class="muted">(falta ${esc(getCard(x.miss[0]).name)})</span>`).join(' · ')}</p>` : ''}</div>
    <div class="btnrow">${!h.mulled && !h.turn ? `<button class="btn" id="hMull">${h.marked.size ? `Cambiar ${h.marked.size}` : 'Me quedo'}</button>` : ''}
      <button class="btn primary" id="hNext">Robar (turno ${h.turn + 1})</button><button class="btn" id="hNew">Nueva mano</button><button class="btn ghost" onclick="closeModal()">Cerrar</button></div>`);
  $('#modal').querySelectorAll('.hcard').forEach(b => b.onclick = () => { const i = +b.dataset.i; if (h.marked.has(i)) h.marked.delete(i); else if (h.marked.size < 2) h.marked.add(i); drawHand(); });
  $('#hMull') && ($('#hMull').onclick = () => { const back = []; h.hand = h.hand.filter((k, i) => h.marked.has(i) ? (back.push(k), false) : true); h.hand.push(...h.pile.splice(0, back.length)); h.pile.push(...back); h.marked.clear(); h.mulled = true; drawHand(); });
  $('#hNext').onclick = () => { if (!h.pile.length) return toast('No quedan cartas'); h.mulled = true; h.turn++; h.hand.push(h.pile.shift()); drawHand(); };
  $('#hNew').onclick = openHand;
}

/* ---------- Partidas ---------- */
function legendNames() { const out = []; for (const c of DB.values()) if (c.type === 'Legend') out.push(c.name); return [...new Set(out)].sort(); }
function renderGamesView(d) {
  const ms = d.matches; const W = ms.filter(m => m.res === 'W').length, L = ms.filter(m => m.res === 'L').length, D = ms.filter(m => m.res === 'D').length;
  const wr = arr => { const w = arr.filter(m => m.res === 'W').length, l = arr.filter(m => m.res === 'L').length; return w + l ? w / (w + l) : null; };
  const first = ms.filter(m => m.first === true), second = ms.filter(m => m.first === false);
  const byOpp = {}; for (const m of ms) (byOpp[m.opp] = byOpp[m.opp] || []).push(m);
  const opps = Object.entries(byOpp).sort((a, b) => b[1].length - a[1].length);
  const bar = p => p == null ? '<span class="muted">–</span>' : `<span class="wr"><i style="width:${p * 100}%;background:${p >= .55 ? 'var(--ok)' : p <= .45 ? 'var(--danger)' : 'var(--gold)'}"></i></span><b class="mono">${Math.round(p * 100)}%</b>`;
  const sel = GAMES_OPP && byOpp[GAMES_OPP] !== undefined ? GAMES_OPP : (GAMES_OPP || null);
  $('#view').innerHTML = `<div class="vwrap">
    <div class="vhead"><div><h1>Partidas</h1><p class="muted">Anota cada partida en segundos y mira contra qué ganas y contra qué no.</p></div></div>
    <div class="vgrid">
      <div class="vmain">
        <div class="panel addm"><div class="sec"><h3>Nueva partida</h3></div>
          <div class="addrow"><input type="text" id="gOpp" list="legList" placeholder="Leyenda rival (ej. Jinx - Loose Cannon)" value="${esc(LAST_OPP)}"><datalist id="legList">${legendNames().map(n => `<option value="${esc(n)}">`).join('')}</datalist>
          <div class="seg" id="gFirst"><button data-v="1" class="${GFIRST === true ? 'on' : ''}">Empecé</button><button data-v="0" class="${GFIRST === false ? 'on' : ''}">Segundo</button></div></div>
          <input type="text" id="gNote" placeholder="Nota rápida (opcional): qué pasó, qué carta decidió…" style="width:100%;margin-top:8px">
          <div class="btnrow"><button class="btn win" data-res="W">Gané</button><button class="btn loss" data-res="L">Perdí</button><button class="btn" data-res="D">Empate</button></div></div>
        <div class="sec"><h3>Por rival</h3><span class="n">${opps.length}</span></div>
        ${opps.length ? `<div class="tbl"><div class="tr thd"><span>Rival</span><span>Partidas</span><span>V-D</span><span>Winrate</span></div>${opps.map(([o, arr]) => `<button class="tr${sel === o ? ' on' : ''}" data-o="${esc(o)}"><span>${esc(o)}</span><span class="mono">${arr.length}</span><span class="mono">${arr.filter(m => m.res === 'W').length}-${arr.filter(m => m.res === 'L').length}</span><span>${bar(wr(arr))}</span></button>`).join('')}</div>` : '<p class="empty">Todavía no hay partidas. Anota la primera arriba.</p>'}
        ${sel ? matchupPanel(d, sel) : ''}
        ${ms.length ? `<div class="sec"><h3>Historial</h3></div><div class="hist">${[...ms].reverse().slice(0, 40).map(m => `<div class="hrow"><span class="res ${m.res}">${m.res === 'W' ? 'V' : m.res === 'L' ? 'D' : 'E'}</span><span class="o">${esc(m.opp)}${m.note ? `<span class="small muted"> · ${esc(m.note)}</span>` : ''}</span><span class="small muted">${m.first === true ? 'Empecé' : m.first === false ? 'Segundo' : ''}</span><span class="small muted mono">${new Date(m.at).toLocaleDateString()}</span><button class="btn sm ghost" data-del="${m.id}" aria-label="Borrar">✕</button></div>`).join('')}</div>` : ''}
      </div>
      <aside class="vside">
        <div class="panel"><div class="sec"><h3>Resumen</h3></div>
          <div class="kpis"><div><b class="mono">${ms.length}</b><span>partidas</span></div><div><b class="mono">${W}-${L}${D ? '-' + D : ''}</b><span>V-D${D ? '-E' : ''}</span></div><div><b class="mono">${wr(ms) == null ? '–' : Math.round(wr(ms) * 100) + '%'}</b><span>winrate</span></div></div>
          <div class="small" style="margin-top:10px">Empezando: ${bar(wr(first))} <span class="muted">(${first.length})</span></div>
          <div class="small">De segundo: ${bar(wr(second))} <span class="muted">(${second.length})</span></div></div>
        <div class="panel"><p class="small muted" style="margin:0">Tip: toca un rival en la tabla para escribir tu plan contra él y qué cartas entran y salen del sideboard.</p></div>
      </aside></div></div>`;
  $('#gFirst').querySelectorAll('button').forEach(b => b.onclick = () => { GFIRST = GFIRST === (b.dataset.v === '1') ? null : b.dataset.v === '1'; renderView(); });
  $('#gOpp').oninput = e => LAST_OPP = e.target.value;
  $('#view').querySelectorAll('[data-res]').forEach(b => b.onclick = () => {
    const opp = $('#gOpp').value.trim(); if (!opp) { $('#gOpp').focus(); return toast('Escribe la leyenda rival'); }
    commit(); d.matches.push({ id: uid('g'), opp, res: b.dataset.res, first: GFIRST, note: $('#gNote').value.trim(), at: Date.now() }); LAST_OPP = opp; save(); renderView(); toast('Partida anotada');
  });
  $('#view').querySelectorAll('.tr[data-o]').forEach(b => b.onclick = () => { GAMES_OPP = GAMES_OPP === b.dataset.o ? null : b.dataset.o; renderView(); });
  $('#view').querySelectorAll('[data-del]').forEach(b => b.onclick = () => { commit(); d.matches = d.matches.filter(m => m.id !== b.dataset.del); save(); renderView(); });
  bindMatchup(d, sel);
}
let GAMES_OPP = null, LAST_OPP = '', GFIRST = null;
function matchupPanel(d, opp) {
  const mu = d.matchups[opp] || { plan: '', ins: {}, outs: {} };
  const side = d.cards.filter(e => e.zone === 'side'), main = d.cards.filter(e => e.zone === 'main');
  const nin = Object.values(mu.ins).reduce((a, b) => a + b, 0), nout = Object.values(mu.outs).reduce((a, b) => a + b, 0);
  const step = (e, bag, kind) => `<div class="stp"><span>${esc(getCard(e.key).name)}</span><span class="ctl"><button data-k="${esc(e.key)}" data-kind="${kind}" data-d="-1" aria-label="menos">−</button><b class="mono">${bag[e.key] || 0}</b><button data-k="${esc(e.key)}" data-kind="${kind}" data-d="1" aria-label="más">+</button></span></div>`;
  return `<div class="panel mu"><div class="sec"><h3>Contra ${esc(opp)}</h3><span class="n ${nin !== nout ? 'warn' : ''}">Entran ${nin} · Salen ${nout}</span></div>
    <div class="field"><label for="muPlan">Plan para este matchup</label><textarea id="muPlan" rows="3" placeholder="Qué cuidar, qué guardar, cómo ganan ellos…">${esc(mu.plan)}</textarea></div>
    <div class="mugrid"><div><div class="small muted">Entran (del sideboard)</div>${side.map(e => step(e, mu.ins, 'ins')).join('') || '<p class="small muted">Sin sideboard</p>'}</div>
    <div><div class="small muted">Salen (del main)</div>${main.map(e => step(e, mu.outs, 'outs')).join('')}</div></div></div>`;
}
function bindMatchup(d, opp) {
  if (!opp || !$('#muPlan')) return;
  const mu = d.matchups[opp] = d.matchups[opp] || { plan: '', ins: {}, outs: {} };
  const p = $('#muPlan'); p.addEventListener('focus', () => commit(), { once: true }); p.oninput = () => { mu.plan = p.value; save(); };
  $('#view').querySelectorAll('.stp button').forEach(b => b.onclick = () => {
    const bag = mu[b.dataset.kind], k = b.dataset.k, max = deckQty(k, b.dataset.kind === 'ins' ? 'side' : 'main');
    commit(); bag[k] = Math.max(0, Math.min(max, (bag[k] || 0) + +b.dataset.d)); if (!bag[k]) delete bag[k]; save(); renderView();
  });
}

</script>
</body></html>
